[platformio]
default_envs = xiao

; Firmware for the Seeed XIAO ESP32C3
[env:xiao]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
  -D DRINK_DEBUG        ; serial log over USB; remove once everything works
test_ignore = *

; Reminder logic tests on the computer: pio test -e native
[env:native]
platform = native
test_framework = unity
